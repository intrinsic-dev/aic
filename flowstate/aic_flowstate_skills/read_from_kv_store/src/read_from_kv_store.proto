syntax = "proto3";

package ai.flowstate;

import "google/protobuf/any.proto";

message StorageLocation {
  string store = 1;
  string key = 2;
}

message ReadFromKVStoreParams {
  StorageLocation location = 1;
}

message ReadFromKVStoreResult {
  google.protobuf.Any value = 1;
  repeated google.protobuf.Any values = 2;
  bool success = 3;
  string message = 4;
}
