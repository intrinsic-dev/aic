syntax = "proto3";

package ai.flowstate;

message LifecycleTransitionSkillParams {
  string node_name = 1;
  Transition transition = 2;

  enum Transition {
    create = 0;
    configure = 1;
    cleanup = 2;
    activate = 3;
    deactivate = 4;
    shutdown = 5;
    destroy = 6;
  }

  double timeout = 3;
}

message LifecycleTransitionSkillResult {
  bool success = 1;
  string message = 2;
}
