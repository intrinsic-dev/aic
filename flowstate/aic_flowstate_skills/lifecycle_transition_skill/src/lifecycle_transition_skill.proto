syntax = "proto3";

package ai.flowstate;

message LifecycleTransitionSkillParams {
  string node_name = 1;
  Transition transition = 2;

  enum Transition {
    UNKNOWN = 0;
    CONFIGURE = 1;
    CLEANUP = 2;
    ACTIVATE = 3;
    DEACTIVATE = 4;
    UNCONFIGURED_SHUTDOWN = 5;
    INACTIVE_SHUTDOWN = 6;
    ACTIVE_SHUTDOWN = 7;
    DESTROY = 8;
  }
}

message LifecycleTransitionSkillResult {
  bool success = 1;
  string message = 2;
}
