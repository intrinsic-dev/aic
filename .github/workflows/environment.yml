name: environment

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Weekly, Mondays at 06:00 UTC. Catches upstream package drift even without new commits.
    - cron: '0 6 * * 1'
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  environment:
    name: Pixi Environment Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: prefix-dev/setup-pixi@v0.9.2
        with:
          pixi-version: v0.63.2
          # Install is performed explicitly in the next step.
          run-install: false
      - name: pixi install --locked
        run: |
          pixi install --locked
